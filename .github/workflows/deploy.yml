name: deploy

on:
  # Break-glass manual deploy. The normal path is the workflow_run chain below;
  # this exists because that chain depends on Actions receiving events, and when
  # event delivery stalls (as it did on 2026-08-06, when neither push nor
  # workflow_run produced runs while dispatch did) there is otherwise no way to
  # ship at all.
  #
  # It deploys whatever `main` currently points at — the script resets to
  # origin/main — and it does NOT wait for ci. Check that ci is green for that
  # commit before using it.
  workflow_dispatch:
  workflow_run:
    workflows:
      - ci
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    # On a manual run there is no upstream workflow_run, so the conclusion is
    # null; without the first clause the job would be silently skipped.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest code and rebuild on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd /srv/habis-finance-api
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans --wait
            docker compose exec -T api php artisan migrate --force --ansi
            docker compose exec -T api php artisan db:seed --class=Database\\Seeders\\RolesAndPermissionsSeeder --force --ansi
            docker compose exec -T api php artisan db:seed --class=Database\\Seeders\\StandardReportDefinitionSeeder --force --ansi
            docker compose exec -T api php artisan db:seed --class=Database\\Seeders\\BatchProcedureSeeder --force --ansi
            docker compose exec -T api php artisan db:seed --class=Database\\Seeders\\LoanOperationCodeSeeder --force --ansi
            docker compose exec -T api php artisan db:seed --class=Database\\Seeders\\BootstrapAdminSeeder --force --ansi
            docker compose exec -T api php -d memory_limit=512M artisan scramble:export --path=public/docs/api.json
            docker compose exec -T api php artisan queue:restart --ansi
